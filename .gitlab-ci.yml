mintsclub-back-v3:
  stage: test
  tags:
    - mintsclub-io
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - echo "Deploy to Mintsclub"
    - ssh-add <(echo "$SSH_KEY_V3")
    - rm -rf .git
    - ssh -o StrictHostKeyChecking=no mintsclub@10.10.10.41 "cd /home/mintsclub/mintsclub-backend/backend-v2/; git reset --hard; git pull origin task/MintsClubBackend-V3; npm install; npm run build; pm2 start backend; exit"
  only:
    - task/MintsClubBackend-V3

