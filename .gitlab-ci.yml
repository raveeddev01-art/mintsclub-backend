mints-backend:
  stage: deploy
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - echo "Deploy to dev server"
    - ssh-add <(echo "$ID_RSA")
    - rm -rf .git
    - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP " cd /home/mints-club/ariswap/backend; git reset --hard; git pull origin task/Integrate-MintsClubBackend; cd /home/mints-club/ariswap/backend/backend; npm install; pm2 reload 0; exit"
  only:
    - task/Integrate-MintsClubBackend
