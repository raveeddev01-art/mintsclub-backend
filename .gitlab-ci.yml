   
mintsclub-back-v2:
  stage: deploy
  tags:
    -  mintsclub-io 
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - echo "Deploy to AWS server"
    - ssh-add <(echo "$AWS_SSH_KEY")
    - rm -rf .git
    - ssh -o StrictHostKeyChecking=no mintsclub@3.135.80.29 "cd /home/mintsclub/mintsclub-prod/backend-v2/backend; git reset --hard; git pull origin task/MintsClubBackend-V2; npm install; pm2 restart backend-v2; exit"
  only:
    - task/MintsClubBackend-V2